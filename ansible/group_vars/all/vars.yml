---
# Values Terraform owns (name_prefix, aws_region, dockerhub_user, db_user,
# db_name, app_url) come from terraform.yml, which infra/main writes next to
# this file.
# SSH connection settings live in inventory.ini.
# Skips interpreter discovery, which warns on every run.
ansible_python_interpreter: /usr/bin/python3

# The password lives only in Parameter Store. The lookup runs on the controller with
# the admin's AWS credentials (boto3 in Ansible's Python), each time a task uses it.
db_password: "{{ lookup('amazon.aws.ssm_parameter', name_prefix ~ 'db-password', region=aws_region) }}"

# The db host's private IP from gathered facts; the plays gather it even under --limit.
db_ip: "{{ hostvars[groups['db'][0]]['ansible_facts']['default_ipv4']['address'] }}"
