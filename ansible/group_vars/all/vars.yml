---
# SSH connection settings live in inventory.ini.
# Skips interpreter discovery, which warns on every run.
ansible_python_interpreter: /usr/bin/python3

dockerhub_user: nitramabuar

# The postgres image creates a database named after its user.
db_user: postgres
db_name: postgres
db_password: "{{ vault_db_password }}"

# Private IPs from gathered facts; the plays gather them even under --limit.
backend_ip: "{{ hostvars[groups['backend'][0]]['ansible_facts']['default_ipv4']['address'] }}"
db_ip: "{{ hostvars[groups['db'][0]]['ansible_facts']['default_ipv4']['address'] }}"
