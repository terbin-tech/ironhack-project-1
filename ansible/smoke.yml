---
# End to end through the load balancer: a vote cast at the public HTTPS URL
# travels through Redis and the worker into Postgres.

- name: Cast a vote through the load balancer and watch it reach Postgres
  hosts: localhost
  gather_facts: false
  vars:
    psql: "docker exec db psql -U {{ db_user }} -d {{ db_name }} -tAc"
  tasks:
    # Unique per run, so the check below sees this vote and no other voter's.
    - name: Pick a voter id for the smoke vote
      ansible.builtin.set_fact:
        marker: "smoke-{{ lookup('ansible.builtin.pipe', 'date +%s%N') }}"

    # vote uses the voter_id cookie as the voter id and the worker stores it in votes.id.
    - name: Cast a vote
      ansible.builtin.uri:
        url: "https://{{ app_url | urlsplit('hostname') }}/"
        method: POST
        body_format: form-urlencoded
        body:
          vote: a
        headers:
          Cookie: "voter_id={{ marker }}"

    # Retried: right after a deploy the worker may not have created the table yet.
    - name: Wait for the worker to store it
      ansible.builtin.command: "{{ psql }} \"select count(*) from votes where id = '{{ marker }}'\""
      delegate_to: "{{ groups['db'][0] }}"
      register: stored
      changed_when: false
      until: stored.rc == 0 and (stored.stdout | int) >= 1
      retries: 15
      delay: 2

    - name: Count all votes
      ansible.builtin.command: "{{ psql }} 'select count(*) from votes'"
      delegate_to: "{{ groups['db'][0] }}"
      register: total
      changed_when: false

    - name: The result page answers
      ansible.builtin.uri:
        url: "https://{{ app_url | urlsplit('hostname') }}/result/"

    - name: Report
      ansible.builtin.debug:
        msg: "vote {{ marker }} reached Postgres through {{ app_url }}; {{ total.stdout }} votes in total"
