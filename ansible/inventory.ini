# Host names resolve through ssh_config, generated by infra/main.
# The connection settings live here rather than in group_vars, so they apply only
# with this inventory: a Packer build brings its own inventory and its own SSH key.
# There is no ansible.cfg: Ansible ignores one in a world-writable directory,
# which every directory on a WSL /mnt/c checkout is.
[all:vars]
ansible_user=ubuntu
ansible_ssh_common_args="-F {{ inventory_dir }}/ssh_config"

[frontend]
frontend-instance-1

[backend]
backend-instance-1

[db]
db-instance-1
