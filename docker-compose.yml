# Local run of the whole stack with our published images.
# The password below is for local use only; the AWS deployment takes it from SSM Parameter Store.

services:
  vote:
    image: ${DOCKERHUB_USER:-nitramabuar}/vote:latest
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - back-tier

  result:
    image: ${DOCKERHUB_USER:-nitramabuar}/result:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    networks:
      - back-tier

  worker:
    image: ${DOCKERHUB_USER:-nitramabuar}/worker:latest
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - back-tier

  redis:
    image: redis:8
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql, not /var/lib/postgresql/data
      - "db-data:/var/lib/postgresql"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks:
      - back-tier

volumes:
  db-data:

networks:
  back-tier:
